; =============================================================================
; _configtotal.ini — configuración del proyecto para davgen
; Completar este archivo y ejecutar:  davgen generar
;
; Este archivo NO lleva contraseñas: se puede versionar. Los accesos a la base
; de datos y al FTP van en dos archivos aparte, uno por entorno:
;   _acceso.desarrollo.ini   (donde se desarrolla y se prueba)
;   _acceso.produccion.ini   (el sitio publicado)
; davgen usa el de desarrollo salvo que se pida:  --entorno produccion
; Todas las rutas son RELATIVAS a esta carpeta del proyecto.
; =============================================================================

[proyecto]
; REQUERIDO · nombre visible del sistema (título del portal)
nombre =
; REQUERIDO · prefijo de módulo para las tablas (2 a 6 letras): tbl_{modulo}_*
modulo =
; opcional · aparece en los encabezados @author del código generado
; (vacío = no se escribe @author)
autor =

[entrada]
; REQUERIDO · de dónde salen las entidades: mockup | bd
tipo = mockup
; si tipo = mockup → ruta relativa al .html o carpeta del mockup
; (colocar el mockup dentro de esta carpeta de proyecto, ej: mockup/)
mockup = mockup

[opciones]
; todo opcional — defaults sensatos
; entidades o tablas a excluir, separadas por coma
excluir =
; rutas públicas sin token:  tbl_x:sel,get ; tbl_y:sel
publico =
; middleware de las rutas privadas
middleware = auth:sanctum
; reutilizar las conexiones a MySQL entre peticiones (si | no). El hosting
; compartido limita las conexiones NUEVAS por hora de cada usuario de la base
; (error 1226 max_connections_per_hour): sin esto, pocos usuarios bastan para
; dejar el sitio caído una hora. Poner «no» solo si aparece el error 1203
; (demasiadas conexiones abiertas a la vez, max_user_connections).
conexiones_persistentes = si
; tamaño máximo de archivos subidos (MB) — SEMILLA inicial: después de la
; primera ejecución manda tbl_seg_parametro (clave max_archivo_mb)
max_archivo_mb = 10
; extensiones permitidas — SEMILLA inicial: después manda tbl_seg_parametro
; (clave extensiones_archivo); editar el valor en la BD, sin regenerar
extensiones_archivo = pdf,jpg,jpeg,png,doc,docx,xls,xlsx
; columnas de SOLO LECTURA por tabla: el dominio las gestiona (SPs propios)
; y NO aparecen en el formulario generado:  tbl_x:campo1,campo2 ; tbl_y:campo3
solo_lectura =
; tablas SIN botón "Dar de baja" en las páginas generadas (separadas por coma)
sin_baja =
; tablas de SOLO CONSULTA (ej. historiales que escriben los SPs del dominio):
; la página generada solo lista/busca, sin alta ni edición ni baja
solo_consulta =

[generar]
; ACCIONES — escriben FUERA del proyecto (en la BD y en el FTP del entorno).
; Aplicar en la BD del entorno los SPs pcru*, los seeds de seguridad y las
; vistas que falten (DROP+CREATE solo de los SPs nuevos o distintos)
aplicar_sps = si
; Las dos siguientes SOLO actúan con --entorno produccion (en desarrollo nunca
; se sube nada) y necesitan [ftp] completo en _acceso.produccion.ini.
; Subir el backend generado a la nube por FTP al terminar
produccion = no
; Desplegar el frontend React a la nube al terminar
front = no
; EXTRAS opcionales — por DEFECTO NO se generan (no).
; Activar con: si | yes | true | 1   ·   desactivar con: no | '' (vacío)
; FormRequest por tabla: validación 422 derivada del esquema + type-hint en
; los controllers add/upd (deja de escribirse la validación a mano)
form_requests = no
; Suite de tests PHP (Pest/PHPUnit) + factories en tests/Feature/Generados —
; auth, 2FA, permisos, rate-limit, CRUD y validación por tabla
tests = no
; Hooks y componentes React reutilizables (useCrud, DataTable, CampoFormulario
; y SelectRelacion: dropdown de FK con label desde su vista)
componentes_react = no
; Workflow de Integración Continua (GitHub Actions): php artisan test +
; npm test + `davgen verificar` (rompe el build si editan lo generado)
ci = no
; Especificación OpenAPI 3 (openapi.json) + Swagger UI (swagger.html)
openapi = no
; Endpoint de exportación a CSV por tabla (POST /{tabla}/export)
export = no

[legal]
; Textos de «Privacidad» y «Términos de uso» que muestra el sistema (pie del
; ingreso y menú). Son un punto de partida: revisarlos con quien responda
; legalmente. Ver components/generados/LEEME-LEGAL.md.
; Persona o empresa que responde por los datos
responsable =
; Correo o teléfono para consultas y pedidos sobre los datos
contacto =
; País (o ciudad y país) cuya ley rige los términos. Ej: Bolivia
jurisdiccion =
; Dónde se guardan los datos: empresa de alojamiento y país. Ej: Hosting X (EE. UU.)
alojamiento =
; Fecha desde la que rigen estos textos. Ej: 1 de marzo de 2026
vigente_desde =
; Días que se guarda el registro de actividad (bitácora); después se borra
; solo. 0 = no se borra. SEMILLA inicial: después manda tbl_seg_parametro
; (clave retencion_bitacora_dias); si se cambia allá, cambiarlo también aquí
; para que el texto de privacidad diga lo mismo.
retencion_bitacora_dias = 365

[seguridad]
; ── Usuario administrador sembrado (tbl_seg_usuario id=1) ───────────────────
; Correo del admin: IDÉNTICO en el seed, la documentación y el testing. El seed
; usa INSERT ... ON DUPLICATE KEY UPDATE, así que cambiarlo aquí y regenerar
; ACTUALIZA el correo en la BD (sin tocar la contraseña).
admin_email = admin@localhost
admin_nombre = Administrador
; (la contraseña inicial del admin va en _acceso.<entorno>.ini)
; ── Login con Google (OPCIONAL — apagado por defecto) ───────────────────────
; Para activarlo hace falta un Client ID OAuth PROPIO (Google Cloud Console):
; ver CONFIGURAR-GOOGLE-AUTH.md. El uso del botón debe respetar las pautas de
; marca de Google Identity (davgen usa el botón oficial, sin modificarlo).
google_auth_activo = no
; Client ID OAuth (termina en .apps.googleusercontent.com). Es público (va en
; el frontend); el Client SECRET no se usa en este flujo.
google_client_id =
; Correo DUEÑO (una cuenta Google tuya) sembrado como admin: puede entrar con
; Google desde el inicio y aprobar/denegar el acceso de otros. Vacío = ninguno.
owner_email =
; Dominios que se auto-aceptan al entrar con Google (coma). Ej: miempresa.com
; Un correo de esos dominios entra directo; los demás quedan en cola de aprobación.
google_dominios_permitidos =
; Roles que SOLO pueden entrar con Google (coma): se les rechaza el login por
; contraseña. Ej: cliente. Vacío = todos pueden usar ambos métodos.
roles_solo_google = cliente
