; =============================================================================
; _acceso.__ENTORNO__.ini — ACCESOS del entorno de __TITULO__
;
; Aquí van los usuarios y contraseñas de este entorno. Hay DOS archivos:
;   _acceso.desarrollo.ini   la base donde se desarrolla y se prueba (tu PC)
;   _acceso.produccion.ini   la base y el FTP del sitio publicado
; davgen usa el de desarrollo salvo que se pida:  --entorno produccion
;
; NO SE VERSIONA (está en .gitignore). Para git se usa
; _acceso.__ENTORNO__.ejemplo.ini, que davgen escribe sin las contraseñas.
; Valores con ; o # (típico en contraseñas): se leen completos, sin comillas.
; =============================================================================

[bd]
; Base de datos MySQL / MariaDB de este entorno.
; __AYUDA_BD__
host = __HOST__
puerto = 3306
usuario =
password =
database =

[ftp]
; __AYUDA_FTP__
host =
usuario =
password =
; carpeta del servidor donde va el backend (la app React va a la raíz del sitio)
ruta_remota = /servicio
; URL pública CON https:// (ej: https://mi-dominio.com)
url =

[seguridad]
; Contraseña INICIAL del administrador en la base de este entorno. ESCRIBE LA
; TUYA: davgen no trae ninguna (mínimo 8 caracteres, con letras y números; no
; uses una que ya uses en otro sitio). Sin ella, davgen no genera.
; Solo se usa al sembrar el usuario la primera vez: cambiarla aquí después NO
; cambia la de la base. Cambiarla desde la aplicación al ingresar.
admin_password = __ADMIN_PASSWORD__
